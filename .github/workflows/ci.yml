name: CI
# Checks only: formatting, lints and tests. It builds no package, uses no
# secret and publishes nothing; packaging stays in the manual release workflow.
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: powerkit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  CARGO_INCREMENTAL: '0'
  CARGO_TERM_COLOR: always
jobs:
  repository:
    name: Repository checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate docs and shared metadata
        run: |
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt,clippy
          cargo test --manifest-path scripts/Cargo.toml --locked
          cargo fmt --all --manifest-path scripts/Cargo.toml -- --check
          cargo clippy --manifest-path scripts/Cargo.toml --locked --all-targets -- -D warnings
      - name: Validate GitHub workflows
        run: |
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/actionlint.tar.gz" https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tar.gz' | (cd "$RUNNER_TEMP" && sha256sum -c -)
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" .github/workflows/ci.yml .github/workflows/release.yml
  neutral:
    name: Platform-neutral crates on ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            runner: ubuntu-24.04
          - name: macOS
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test and lint powerkit-core and powerkit-app
        run: |
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt,clippy
          cargo test --locked -p powerkit-core -p powerkit-app
          cargo clippy --locked -p powerkit-core -p powerkit-app --all-targets -- -D warnings
  windows:
    name: Windows ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
          - arch: x64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure native Rust
        run: |
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt,clippy
          if ($LASTEXITCODE) { throw 'Rust installation failed' }
          rustup override set 1.99.1
          if ($LASTEXITCODE) { throw 'Rust selection failed' }
          rustup target add ${{ matrix.target }}
          if ($LASTEXITCODE) { throw 'Rust target installation failed' }
      - name: Format, test and lint
        run: |
          cargo fmt --all -- --check
          if ($LASTEXITCODE) { throw 'Formatting failed' }
          cargo test --locked --target ${{ matrix.target }}
          if ($LASTEXITCODE) { throw 'Tests failed' }
          cargo clippy --locked --all-targets --target ${{ matrix.target }} -- -D warnings
          if ($LASTEXITCODE) { throw 'Clippy failed' }
