name: Bug report
description: Report a reproducible PowerKit problem
body:
  - type: markdown
    attributes:
      value: "For vulnerabilities, follow SECURITY.md instead. Remove personal paths and metadata."
  - type: input
    id: version
    attributes:
      label: PowerKit version
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Windows build, ARM64/x64, and installer or raw executable
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps, expected behavior and actual behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Redacted logs or screenshots
