version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # The windows-rs crates depend on each other and only build when they
      # move together.
      windows-rs:
        patterns:
          - "windows"
          - "windows-*"
  - package-ecosystem: cargo
    directory: /scripts
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
