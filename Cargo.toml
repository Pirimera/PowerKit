[package]
name = "powerkit"
version = "0.2.0"
edition = "2024"
rust-version = "1.99.1"
description = "Lightweight native Windows utilities, built for ARM64 first"
license = "MIT"
repository = "https://github.com/Pirimera/PowerKit"
readme = "README.md"
publish = false

[target.'cfg(windows)'.dependencies]
velopack = "=1.2.161"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Media_Audio", "Win32_Storage_FileSystem", "Win32_Security", "Win32_System_Threading", "Win32_System_Power", "Win32_System_SystemInformation", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_UI_Accessibility", "Win32_UI_Controls", "Win32_UI_Controls_Dialogs", "Win32_UI_Input_KeyboardAndMouse", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_UI_HiDpi"] }
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Direct2D", "Win32_Graphics_Direct2D_Common", "Win32_Graphics_Dxgi_Common", "UI_ViewManagement"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
