[package]
name = "powerkit"
version = "0.20.0"
edition = "2024"
rust-version = "1.99.1"
description = "Lightweight native Windows utilities, built for ARM64 first"
license = "MIT"
repository = "https://github.com/Pirimera/PowerKit"
readme = "README.md"
publish = false

[target.'cfg(windows)'.dependencies]
windows-reactor = "=0.100.0"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Media_Audio", "Win32_Storage_FileSystem", "Win32_Storage_Packaging_Appx", "Win32_Security", "Win32_System_Threading", "Win32_System_Power", "Win32_System_Shutdown", "Win32_System_StationsAndDesktops", "Win32_System_SystemInformation", "Win32_System_Time", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_DataExchange", "Win32_System_JobObjects","Win32_System_Registry", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_UI_Accessibility", "Win32_UI_Controls", "Win32_UI_Controls_Dialogs", "Win32_UI_Input_KeyboardAndMouse", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_UI_HiDpi"] }
windows-core = "0.62.2"
windows-collections = "0.3.2"
windows-future = "0.3.2"
windows = { version = "0.62.2", features = ["ApplicationModel", "Foundation", "Management_Deployment", "Storage_Streams", "Web_Http", "Web_Http_Headers", "Win32_Foundation", "Win32_Graphics_Direct2D", "Win32_Graphics_Direct2D_Common", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Imaging", "Win32_Security", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_LibraryLoader", "Win32_System_Ole", "Win32_System_Threading", "Win32_System_Variant", "Win32_System_WinRT", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_Shell_PropertiesSystem", "Win32_UI_WindowsAndMessaging", "UI_ViewManagement"] }

[target.'cfg(windows)'.build-dependencies]
windows-bindgen = "=0.62.1"

[lib]
name = "powerkit_shell"
path = "src/shell_menu.rs"
crate-type = ["cdylib"]

[profile.release]
lto = true
codegen-units = 1
strip = true
