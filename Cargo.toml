[package]
name = "powerkit"
version = "0.2.0"
edition = "2024"
rust-version = "1.99"

[target.'cfg(windows)'.dependencies]
velopack = "=1.2.161"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_Security", "Win32_System_Threading", "Win32_System_Power", "Win32_System_SystemInformation", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_Graphics_Gdi", "Win32_UI_HiDpi"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
